# Despliegue de prueba con PostgreSQL, API, frontend y proxy HTTPS automático.
# Uso (desde la raíz del proyecto):
#   docker compose --env-file .env -f infrastructure/compose/compose.prod.yaml up -d --build
#
# Nota: Caddy es el único componente añadido respecto al stack aprobado y
# actúa solo como reverse proxy con certificados Let's Encrypt automáticos.

name: plataforma-educativa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plataforma}
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plataforma

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma}
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:?Defina SESSION_TTL_SECONDS en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://sistematizacion.itsoeh.edu.mx}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-dev-admin}
      INITIAL_DOCENTE_PASSWORD: ${INITIAL_DOCENTE_PASSWORD:-clave-docente}
      INITIAL_ESTUDIANTE_PASSWORD: ${INITIAL_ESTUDIANTE_PASSWORD:-clave-estudiante}
    networks:
      - plataforma

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://sistematizacion.itsoeh.edu.mx/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    networks:
      - plataforma

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-sistematizacion.itsoeh.edu.mx}
    networks:
      - plataforma

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  plataforma:
    driver: bridge
