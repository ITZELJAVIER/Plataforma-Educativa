# Orquestación de la plataforma — tarea 1.2 del cambio `add-platform-foundation`.
#
# ESTADO: infraestructura preparada, despliegue no validado en este entorno.
#   - Los Dockerfiles y el código/manifiestos de `user-auth` ya existen, pero Docker
#     no está disponible para comprobar `docker compose config`.
#   - Las variables de entorno de ejemplo y los parámetros del enlace MQTT se
#     definen en la tarea 1.3; aquí solo se declaran variables con valores de
#     ejemplo NO reales.
#   - El Gateway central NO forma parte de esta orquestación: se despliega de
#     forma independiente, documentado en `infrastructure/gateway/README.md`.
#   - No se incluye Redis ni ningún producto broker MQTT; no se definen tópicos,
#     QoS ni retención de mensajes.
#
# Comando previsto, cuando existan los archivos de aplicación (no ejecutado aquí):
#   docker compose -f infrastructure/compose/compose.yaml up --build

name: plataforma-educativa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plataforma}
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-el-entorno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plataforma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma}
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-el-entorno}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - plataforma
    # Healthcheck pendiente: requiere el endpoint de salud de la tarea 8.3.

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - plataforma
    # Healthcheck pendiente: requiere el servidor estático definitivo.

volumes:
  postgres_data:

networks:
  plataforma:
    driver: bridge
