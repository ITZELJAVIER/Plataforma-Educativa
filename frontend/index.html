<!doctype html>
<html lang="es" data-theme="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma Educativa IoT: gestión de dispositivos y periféricos para prácticas educativas." />
    <meta name="theme-color" content="#0b213f" />
    <title>Plataforma Educativa IoT</title>
    <script>
      (function () {
        try {
          var preferencia = localStorage.getItem('plataforma-educativa-tema');
          var oscuro = preferencia === 'oscuro' ||
            (preferencia !== 'claro' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = oscuro ? 'oscuro' : 'claro';
          document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'claro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
